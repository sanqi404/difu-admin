# 地府生死铺 · Alembic 配置（实际数据库地址由 migrations/env.py 从 app.config 读取）
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 占位，真实地址见 env.py：settings.DATABASE_URL
sqlalchemy.url = sqlite+aiosqlite:///./data/difu_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
